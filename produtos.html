<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo de produtos hospitalares — Qualinorte</title>
<meta name="description" content="Móveis e equipamentos hospitalares com certificação Anvisa. Camas, macas, carrinhos, armários, mesas cirúrgicas e mais.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css?v=13">
<link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
<link rel="icon" type="image/png" sizes="512x512" href="assets/img/favicon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
</head>
<body>
<header class="site-header" id="site-header"></header>

<section class="page-hero">
  <div class="container">
    <h1>Catálogo completo</h1>
    <p>Explore os produtos hospitalares certificados Anvisa da Qualinorte. Use os filtros para encontrar o ideal para sua unidade.</p>
  </div>
</section>

<div class="container breadcrumb"><a href="index.html">Início</a><span class="sep">›</span>Catálogo</div>

<section class="section" style="padding-top:0">
  <div class="container">
    <div class="catalog-layout">
      <aside class="filters" id="filters-panel" aria-label="Filtros de produto">
        <button type="button" class="filters-toggle" onclick="document.getElementById('filters-panel').classList.toggle('open')">Filtrar produtos</button>
        <div class="filters-body">
        <h4>Busca</h4>
        <input id="search-input" type="search" placeholder="Buscar produto ou SKU">
        <h4>Categoria</h4>
        <label><input type="checkbox" name="cat" value="camas"> Camas Hospitalares</label>
        <label><input type="checkbox" name="cat" value="macas"> Macas</label>
        <label><input type="checkbox" name="cat" value="carrinhos"> Carrinhos</label>
        <label><input type="checkbox" name="cat" value="armarios"> Armários e Gaveteiros</label>
        <label><input type="checkbox" name="cat" value="mesas"> Mesas Cirúrgicas</label>
        <label><input type="checkbox" name="cat" value="cadeiras"> Cadeiras e Poltronas</label>
        <label><input type="checkbox" name="cat" value="biombos"> Biombos</label>
        <label><input type="checkbox" name="cat" value="suportes"> Suportes e Acessórios</label>
        <label><input type="checkbox" name="cat" value="escritorio"> Móveis de Escritório</label>
        <label><input type="checkbox" name="cat" value="epi"> EPI Hospitalar</label>
        <h4>Material</h4>
        <label><input type="checkbox" name="material" value="inox"> Aço inox 304</label>
        <label><input type="checkbox" name="material" value="aco-epoxi"> Aço com pintura epóxi</label>
        <h4>Disponibilidade</h4>
        <label><input type="checkbox" id="filter-stock"> Somente em estoque em Manaus</label>
        </div>
      </aside>
      <div>
        <div class="catalog-toolbar">
          <span id="result-count" style="color:var(--color-muted);font-size:.9rem"></span>
          <div style="display:flex;align-items:center;gap:.5rem">
            <label style="font-size:.85rem;color:var(--color-muted)">Ordenar:</label>
            <select id="sort-select">
              <option value="relevance">Relevância</option>
              <option value="name">Nome (A–Z)</option>
              <option value="prazo">Menor prazo</option>
            </select>
          </div>
        </div>
        <div id="product-grid" class="product-grid"></div>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/products.js?v=8"></script>
<script src="assets/js/partials.js?v=6"></script>
<script src="assets/js/main.js?v=9"></script>
</body>
</html>
